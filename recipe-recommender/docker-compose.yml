version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - recipe-db:/app/db
    environment:
      - DATABASE_URL=sqlite:///./db/recipe.db
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    restart: unless-stopped

volumes:
  recipe-db:
